name: Continuous Deployment and push to PyPI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: 3.12

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Validate Python sources
      run: python -m compileall -q src

    - name: Build package
      run: python -m build

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-release
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: 3.12

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Prepare release version
      shell: bash
      run: |
        TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
        if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::Expected an existing release tag in vMAJOR.MINOR.PATCH format; got '$TAG'"
          exit 1
        fi
        NEW_TAG="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
        sed -i "s/version='.*',/version='${NEW_TAG}',/" setup.py
        echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

    - name: Build release package
      run: python -m build

    - name: Create Tag
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add setup.py
        git commit -m "Bump version to ${NEW_TAG}"
        git tag -a "$NEW_TAG" -m "Release version $NEW_TAG"
        git push origin "refs/tags/$NEW_TAG"

    - name: Create Release
      uses: softprops/action-gh-release@v2.0.5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ env.NEW_TAG }}
        generate_release_notes: true

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN2 }}